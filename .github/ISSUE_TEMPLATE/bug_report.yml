name: Bug report
description: A tool returned a wrong answer, failed, or behaved unexpectedly.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. The `meta` block in a tool response tells us
        which provider served the data and whether it was cached — including it
        usually resolves the question immediately.
  - type: dropdown
    id: tool
    attributes:
      label: Which tool?
      options:
        - coord_convert
        - coord_describe
        - coord_transform_crs
        - geom_measure
        - geom_transform
        - geom_overlay
        - geom_relate
        - place_geocode
        - place_reverse
        - place_search
        - route_directions
        - route_isochrone
        - route_matrix
        - terrain_elevation
        - terrain_profile
        - env_weather
        - sun_moon
        - time_at_location
        - data_convert
        - geo_capabilities
        - rf_link_budget
        - rf_towers
        - stats_cluster
        - coord_grid_cells
        - not tool-specific / installation / transport
    validations:
      required: true
  - type: dropdown
    id: client
    attributes:
      label: Which MCP client?
      options:
        - Claude Code
        - Claude Desktop
        - OpenAI Codex CLI
        - Cursor
        - VS Code
        - Zed
        - Windsurf
        - Gemini CLI
        - Custom / direct SDK
        - Other
    validations:
      required: true
  - type: textarea
    id: arguments
    attributes:
      label: Arguments passed
      render: json
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: meta
    attributes:
      label: The `meta` block from the response, if you have it
      render: json
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: "output of: mcp-geospatial --version"
