name: Release

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    # DISABLED. This project owns no package on PyPI, and every install line
    # (README, CONTRIBUTING, errors.install_commands) fetches it from git. The
    # upload would try to create the name in pyproject.toml, mcp-geospatial,
    # on PyPI, which nobody has decided to do, or fail for want of a trusted
    # publisher. To publish one day: register the name on PyPI with a trusted
    # publisher for this repository and workflow, move those install lines and
    # server.json to PyPI, then delete this `if`. The build job above still
    # builds the wheel and sdist, as a workflow artifact.
    if: ${{ false }}
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      # Trusted publishing: no long-lived PyPI token in repository secrets.
      # Attestations are generated automatically.
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
