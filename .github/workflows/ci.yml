name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Tests must not reach the network; conftest enforces it, this makes any
  # accidental attempt fail fast rather than hang.
  GEO_CACHE: "0"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --all-extras
      - name: ruff check
        run: uv run ruff check src tests evals
      - name: ruff format
        run: uv run ruff format --check src tests evals

  types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --all-extras
      - run: uv run mypy

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.11", "3.12", "3.13"]
        include:
          # Confirm the pure-wheel promise holds off Linux too.
          - os: macos-latest
            python: "3.12"
          - os: windows-latest
            python: "3.12"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}
      - run: uv sync
      - run: uv run pytest -q --cov=geospatial_mcp --cov-report=term-missing

  newest-sdk:
    # uv.lock pins the MCP SDK, but `uvx --from git+...` ignores the lock and
    # installs the newest mcp 2.x. mcp 2.1 started hiding the message of any tool
    # exception that is not a ToolError, which no test on the locked 2.0 could
    # show. This job runs the suite against what a fresh install actually gets.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Resolve the newest mcp 2.x instead of the locked version
        run: uv sync --all-extras --upgrade-package mcp
      - run: uv run --no-sync python -c "import importlib.metadata as m; print('mcp', m.version('mcp'))"
      - run: uv run --no-sync pytest -q

  evals:
    # Validates that the eval library still matches the tool surface. Offline
    # cases only -- the network ones run in live-apis.yml.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --all-extras
      - run: uv run python evals/run.py --mode validate

  install-check:
    # The uvx promise: a clean install with no system packages, on every OS.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Build the wheel
        run: uv build
      - name: Install it into a clean environment and list the tools
        shell: bash
        run: |
          # Keep everything inside the workspace: Git Bash on Windows maps /tmp to
          # its own directory, which native Windows programs then cannot find.
          uv venv clean-env
          uv pip install --python clean-env dist/*.whl
          # Call the environment's own executables. `uv run` inside a project
          # directory builds a fresh project .venv from source and ignores the
          # clean one, so it would never exercise the installed wheel at all.
          if [ -d clean-env/Scripts ]; then bin=clean-env/Scripts; else bin=clean-env/bin; fi
          "$bin/mcp-geospatial" --version
          "$bin/mcp-geospatial" --list-tools > tools.json
          # The exact count is pinned once, in tests/mcp/test_contract.py. A second
          # copy here drifted the first time the catalogue changed; this only checks
          # that the installed wheel serves a real catalogue.
          "$bin/python" -c "import json,sys; t={x['name'] for x in json.load(open('tools.json'))}; print(f'{len(t)} tools'); sys.exit(0 if len(t) > 15 and {'coord_convert','route_directions','rf_link_budget'} <= t else 1)"
          # And that the wheel, not the checkout, is what ran.
          "$bin/python" -c "import geospatial_mcp, sys; p = geospatial_mcp.__file__; print(p); sys.exit(0 if 'clean-env' in p else 1)"

  attribution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/check_attribution.sh
